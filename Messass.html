<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messass — твой мессенджер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .chat-container {
            width: 400px;
            height: 700px;
            background: #1a1a2e;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        
        /* Шапка */
        .chat-header {
            background: #16213e;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #0f3460;
        }
        
        .header-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
        }
        
        .header-info h2 {
            color: white;
            font-size: 18px;
            margin-bottom: 5px;
        }
        
        .header-info p {
            color: #4ecca7;
            font-size: 14px;
        }
        
        /* Окно сообщений */
        .messages-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #1a1a2e;
        }
        
        /* Сообщения */
        .message {
            display: flex;
            gap: 10px;
            max-width: 80%;
        }
        
        .message.incoming {
            align-self: flex-start;
        }
        
        .message.outgoing {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 35px;
            height: 35px;
            background: #0f3460;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }
        
        .message-content {
            background: #16213e;
            padding: 12px 15px;
            border-radius: 18px;
            color: white;
            position: relative;
            word-break: break-word;
        }
        
        .message.outgoing .message-content {
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
        }
        
        .message-content p {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 5px;
        }
        
        .message-time {
            font-size: 10px;
            opacity: 0.6;
            text-align: right;
        }
        
        /* Поле ввода */
        .chat-input-area {
            background: #16213e;
            padding: 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #0f3460;
        }
        
        .chat-input-area input {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 25px;
            padding: 15px 20px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }
        
        .chat-input-area input:focus {
            border-color: #4ecca7;
        }
        
        .chat-input-area input::placeholder {
            color: #666;
        }
        
        .send-button {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .send-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(0,210,255,0.4);
        }
        
        /* Приветственное сообщение */
        .welcome-message {
            text-align: center;
            color: #666;
            margin: 20px 0;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Шапка чата -->
        <div class="chat-header">
            <div class="header-avatar">M</div>
            <div class="header-info">
                <h2>Messass Community</h2>
                <p>● онлайн 127 человек</p>
            </div>
        </div>
        
        <!-- Окно сообщений -->
        <div class="messages-area" id="messagesArea">
            <div class="welcome-message">
                Добро пожаловать в Messass! 👋
            </div>
            
            <!-- Пример входящего сообщения -->
            <div class="message incoming">
                <div class="message-avatar">A</div>
                <div class="message-content">
                    <p>Привет! Как дела? Это тестовое сообщение</p>
                    <div class="message-time">12:30</div>
                </div>
            </div>
            
            <!-- Пример исходящего сообщения -->
            <div class="message outgoing">
                <div class="message-avatar">Я</div>
                <div class="message-content">
                    <p>Отлично! Создаю свой мессенджер 🚀</p>
                    <div class="message-time">12:31</div>
                </div>
            </div>
        </div>
        
        <!-- Поле ввода -->
        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Написать сообщение..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button class="send-button" onclick="sendMessage()">→</button>
        </div>
    </div>
    
    <script>
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (text === '') return;
            
            // Создаем новое сообщение
            const messagesArea = document.getElementById('messagesArea');
            const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message outgoing';
            messageDiv.innerHTML = `
                <div class="message-avatar">Я</div>
                <div class="message-content">
                    <p>${text}</p>
                    <div class="message-time">${time}</div>
                </div>
            `;
            
            messagesArea.appendChild(messageDiv);
            input.value = '';
            
            // Прокручиваем вниз
            messagesArea.scrollTop = messagesArea.scrollHeight;
            
            // Имитация ответа через 2 секунды
            setTimeout(() => {
                const botMessage = document.createElement('div');
                botMessage.className = 'message incoming';
                botMessage.innerHTML = `
                    <div class="message-avatar">M</div>
                    <div class="message-content">
                        <p>Сообщение получено! (Это тестовая версия)</p>
                        <div class="message-time">${time}</div>
                    </div>
                `;
                messagesArea.appendChild(botMessage);
                messagesArea.scrollTop = messagesArea.scrollHeight;
            }, 2000);
        }
    </script>
</body>
</html>
